 if(!st[S+7]&&st[S+8])st[S+7]=st[S+8];const ns={};for(const k in st){if(k.startsWith('__')){ns[k]=st[k];continue}const m=mv(k);if(m)ns[m]=st[k]}st=ns;
 if(st.__e){st.__e.items=[...new Set((st.__e.items||[]).map(mv).filter(Boolean))];const r={};for(const k in (st.__e.ready||{})){const m=mv(k);if(m)r[m]=st.__e.ready[k]}st.__e.ready=r}
 st.__v=2;save()}
migrate();
function g(k){return st[k]||(st[k]={d:false,t:false,n:'',sk:false,pr:[]})}
function status(s){if(s.sk)return'skip';if(s.d&&s.t)return'done';if(s.d||s.t||s.pr.length)return'prac';return'todo'}
function pose(n){n=n.toLowerCase();for(const[p,r]of RULES){if(!r||new RegExp(r).test(n))return p}return'supine'}
function today(){return new Date().toLocaleDateString('en-GB')}
const LBL={done:'สอบผ่าน ✓',prac:'กำลังฝึก',todo:'ยังไม่เริ่ม',skip:'ไม่ต้องสอบ'};
function render(){
 tabs.innerHTML=D.map((x,i)=>`<button class="${i==cur?'on':''}" onclick="cur=${i};eqf='';render()">${x.s}</button>`).join('');
 const sec=D[cur],eqs=[...new Set(sec.items.map(i=>i[0]))];
 eqbox.innerHTML=`<div class="eqb ${eqf?'':'on'}" onclick="eqf='';render()"><svg viewBox="0 0 64 64"><circle cx="22" cy="24" r="9" fill="#5eead4"/><circle cx="42" cy="24" r="9" fill="#2dd4bf"/><circle cx="22" cy="44" r="9" fill="#4ade80"/><circle cx="42" cy="44" r="9" fill="#facc15"/></svg>ทั้งหมด<small>${sec.items.length} ท่า</small></div>`+
  eqs.map(e=>{const its=sec.items.map((it,i)=>[it,sec.s+'|'+(i+1)]).filter(x=>x[0][0]==e),dn=its.filter(x=>status(g(x[1]))=='done').length;
  return `<div class="eqb ${eqf==e?'on':''}" onclick="eqf='${e}';render()">${EQS[e]}${EQN[e]||e}<small>${dn}/${its.length} ผ่าน</small></div>`}).join('');
 const q=document.getElementById('q').value.toLowerCase(),fv=fs.value;let h='',c={done:0,prac:0,todo:0,skip:0};
 sec.items.forEach((it,i)=>{const k=sec.s+'|'+(i+1),s=g(k),st_=status(s);c[st_]++;
  if(eqf&&it[0]!=eqf)return;if(q&&!it[1].toLowerCase().includes(q))return;if(fv&&fv!=st_)return;
  const last=s.pr.length?s.pr[s.pr.length-1]:'-';
  h+=`<div class="card ${st_}"><div class="ic">${icon(k,it[1],BG[st_])}</div><div class="bd">
  <span class="badge">${LBL[st_]}</span><div class="eq">${EQN[it[0]]||it[0]}</div><div class="t">${i+1}. ${it[1]}</div>
  <div class="row"><button class="chip ${s.d?'on':''}" onclick="tg('${k}','d')">${s.d?'✓':'○'} Demo</button>
  <button class="chip ${s.t?'on':''}" onclick="tg('${k}','t')">${s.t?'✓':'○'} Teaching</button>
  <button class="chip p" onclick="pr('${k}')">💪 ฝึกวันนี้</button>
  <button class="chip sk ${s.sk?'on':''}" onclick="tg('${k}','sk')">ไม่ต้องสอบ</button></div>
  <div class="pr">ฝึกแล้ว ${s.pr.length} ครั้ง · ล่าสุด ${last} ${s.pr.length?`<a href="#" onclick="up('${k}');return false">ย้อนกลับ</a>`:''}</div>
  <textarea rows="1" placeholder="📝 โน้ต" onchange="g('${k}').n=this.value;save()">${s.n}</textarea></div></div>`});
 list.innerHTML=h||'<p class="empty">'+CORGI_FACE+'ไม่มีท่าที่ตรงเงื่อนไข</p>';
 const tot=sec.items.length-c.skip,pg=tot?c.done/tot*100:0,py=tot?c.prac/tot*100:0;
 sum.textContent=`${sec.s} · ผ่าน ${c.done} · กำลังฝึก ${c.prac} · เหลือ ${c.todo} (จาก ${tot} ท่า)`;
 bar.innerHTML=`<div class="g" style="width:${pg}%"></div><div class="y" style="width:${py}%"></div>`}

<path d="M-.9 6.6Q0 8.6 .9 6.6Z" fill="#ff7a92"/></g>`}

<svg x="12" y="8" width="44" height="44" viewBox="-14 -16 28 28">${'X'}</svg></svg>`;

const CORGI_FULL=CORGI_BODY.replace('X',corgi(0,0,1));

for(const k in POSE)POSE[k]=POSE[k].replace(/<circle cx="(\d+)" cy="(\d+)" r="7" fill="#ffd9b8"[^>]*\/>(<circle[^>]*\/>){2}<path[^>]*\/>/,(m,x,y)=>corgi(x,y,.7));
for(const k in POSE)POSE[k]=POSE[k].replace(/(<g [^>]*>)([^<]+)(<\/g>)/,'$1<path d="$2"/>$3');
function prof(){return st.__p||null}
function counts(items,sname){const c={done:0,prac:0,todo:0,skip:0};items.forEach((it,i)=>c[status(g(sname+'|'+(i+1)))]++);return c}
function show(v){if(v=='home'&&!prof())v='reg';vreg.hidden=v!='reg';vhome.hidden=v!='home';vdet.hidden=v!='det';vexam.hidden=v!='exam';if(v=='exam')renderExam();foot.hidden=v=='reg';
 if(v=='home')renderHome();if(v=='det')render();if(v=='reg'){const p=prof()||{};rname.value=p.name||'';rstudio.value=p.studio||'';regPhoto=p.photo||null;rpmsg.textContent='';rprev.innerHTML=avatar(regPhoto)}window.scrollTo(0,0)}
function editProfile(){show('reg')}
regf.onsubmit=e=>{e.preventDefault();const n=rname.value.trim();if(!n)return;st.__p={name:n,studio:rstudio.value.trim(),photo:regPhoto||''};save();show('home')}
function renderHome(){{const e=ex(),n=daysLeft(e.date),c=cdText(n);hcd.textContent=c[0];hcdl.textContent=n>0?'วัน':c[1];const rd=e.items.filter(k=>e.ready[k]).length;hexs.textContent=e.items.length?`${e.date?'สอบ '+fmtD(e.date)+' · ':''}พร้อม ${rd}/${e.items.length} ท่า`:'ตั้งวันสอบและเลือกท่าที่จะสอบ'}const p=prof();hname.textContent=p.name;hav.innerHTML=avatar(p.photo)+CAM;hstudio.textContent=p.studio||'Polestar Pilates · Comprehensive';
 let T={done:0,prac:0,todo:0,skip:0};
 secs.innerHTML=D.map((s,i)=>{const c=counts(s.items,s.s);for(const k in T)T[k]+=c[k];const tot=s.items.length-c.skip,pg=tot?c.done/tot*100:0,py=tot?c.prac/tot*100:0;
  return `<button class="secrow" onclick="cur=${i};eqf='';show('det')"><span class="n">${s.s}</span><span class="pc">${Math.round(pg)}%</span>
  <span class="sb"><span class="g" style="width:${pg}%"></span><span class="y" style="width:${py}%"></span></span>
  <small>ผ่าน ${c.done} · กำลังฝึก ${c.prac} · เหลือ ${c.todo} จาก ${tot} ท่า</small></button>`}).join('');
 const tot=T.done+T.prac+T.todo,a=tot?T.done/tot*100:0,b=tot?T.prac/tot*100:0;dpc.textContent=Math.round(a)+'%';
 const r=15.9155;dn.innerHTML=`<circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--chip)" stroke-width="6"/>
 <circle cx="21" cy="21" r="${r}" fill="none" stroke="#facc15" stroke-width="6" stroke-dasharray="${a+b} ${100-a-b}"/>
 <circle cx="21" cy="21" r="${r}" fill="none" stroke="#22c55e" stroke-width="6" stroke-dasharray="${a} ${100-a}"/>`;
 dstats.innerHTML=[['#22c55e','สอบผ่าน',T.done],['#facc15','กำลังฝึก',T.prac],['var(--chip)','ยังไม่เริ่ม',T.todo]].map(x=>`<div class="stat"><i style="background:${x[0]}"></i>${x[1]}<b>${x[2]} ท่า</b></div>`).join('')+`<div class="stat" style="color:var(--muted)">รวม<b>${tot} ท่า</b></div>`}

function ex(){return st.__e||(st.__e={date:'',items:[],ready:{}})}
function findIt(k){const[s,n]=k.split('|');const sec=D.find(x=>x.s==s);return sec?sec.items[n-1]:null}
function daysLeft(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-t)/864e5)}
function fmtD(d){const[y,m,dd]=d.split('-');return `${+dd}/${+m}/${y}`}
function cdText(n){return n==null?['–','ยังไม่ตั้งวัน']:n>0?[n,'วันก่อนสอบ']:n==0?['วันนี้','วันสอบ']:[-n,'วันที่ผ่านมาแล้ว']}
function renderExam(){const e=ex();edate.value=e.date;const n=daysLeft(e.date),c=cdText(n);ecd.textContent=c[0];ecdl.textContent=e.date?(n>0?'วันก่อนสอบ · '+fmtD(e.date):c[1]+' · '+fmtD(e.date)):c[1];
 const rd=e.items.filter(k=>e.ready[k]).length,tot=e.items.length;esum.textContent=tot?`พร้อมแล้ว ${rd} จาก ${tot} ท่า`:'ยังไม่ได้เลือกท่า';
 ebar.innerHTML=`<div class="g" style="width:${tot?rd/tot*100:0}%"></div>`;
 elist.innerHTML=tot?e.items.map(k=>{const it=findIt(k);if(!it)return'';const s=g(k),r=!!e.ready[k];
  return `<div class="eitem ${r?'rd':''}"><div class="ic">${icon(k,it[1],r?'var(--done-ic)':'var(--prac-ic)')}</div><div class="bd" style="flex:1;min-width:0">
  <div class="t">${it[1]}</div><small>${k.split('|')[0]}<span class="sp ${status(s)}">${LBL[status(s)]}</span> · ฝึกแล้ว ${s.pr.length} ครั้ง${s.pr.length?' · ล่าสุด '+s.pr[s.pr.length-1]:''}</small>
  <div class="row"><button class="chip ${r?'on':''}" onclick="exReady('${k}')">${r?'✓ พร้อมสอบ':'○ ยังต้องซ้อม'}</button><button class="chip p" onclick="pr('${k}');renderExam()">💪 ฝึกวันนี้</button></div></div>
  <button class="x" aria-label="เอาออก" onclick="exToggle('${k}')">×</button></div>`}).join(''):`<p class="empty">${CORGI_FACE}กด "เลือกท่าที่จะสอบ" เพื่อเพิ่มท่าเข้าลิสต์</p>`}
edate.onchange=()=>{ex().date=edate.value;save();renderExam()}
function exReady(k){const e=ex();e.ready[k]=!e.ready[k];save();renderExam()}
function exToggle(k){const e=ex(),i=e.items.indexOf(k);if(i<0)e.items.push(k);else{e.items.splice(i,1);delete e.ready[k]}save();renderExam();if(!pick.hidden)pickList()}
function pickOpen(){pick.hidden=false;psec.innerHTML=D.map((s,i)=>`<option value="${i}">${s.s}</option>`).join('');pickList()}
let pickF='';
function pickList(){const sec=D[psec.value||0],e=ex(),F=[['','ทั้งหมด',''],['done','สอบผ่าน','#22c55e'],['prac','กำลังฝึก','#facc15'],['todo','ยังไม่เริ่ม','#ef4444']];
 const cnt={'':0,done:0,prac:0,todo:0};sec.items.forEach((it,i)=>{const s=status(g(sec.s+'|'+(i+1)));if(s!='skip'){cnt[s]++;cnt['']++}});
 pf.innerHTML=F.map(f=>`<button type="button" class="${pickF==f[0]?'on':''}" onclick="pickF='${f[0]}';pickList()">${f[2]?`<i style="background:${f[2]}"></i>`:''}${f[1]} ${cnt[f[0]]}</button>`).join('');
 const html=sec.items.map((it,i)=>{const k=sec.s+'|'+(i+1),stt=status(g(k));if(stt=='skip'||(pickF&&stt!=pickF))return'';
 return `<label><input type="checkbox" id="pk${i}" ${e.items.includes(k)?'checked':''} onchange="exToggle('${k}')"><span class="pn">${i+1}. ${it[1]}<small>${it[0]}</small></span><span class="sp ${stt}">${LBL[stt]}</span></label>`}).join('');plist.innerHTML=html||'<p class="empty">ไม่มีท่าในสถานะนี้</p>'}
psec.onchange=pickList;
function examText(){const e=ex(),p=prof()||{},n=daysLeft(e.date);let t=`📋 เตรียมสอบ Polestar Pilates${p.name?' – '+p.name:''}\n`;
 if(e.date)t+=`📅 วันสอบ ${fmtD(e.date)}${n>0?` (อีก ${n} วัน)`:n==0?' (วันนี้)':''}\n`;
 const rd=e.items.filter(k=>e.ready[k]);t+=`พร้อมแล้ว ${rd.length}/${e.items.length} ท่า\n`;
 const line=k=>{const it=findIt(k),s=g(k);return `• ${it[1]} [${k.split('|')[0]}] ฝึก ${s.pr.length} ครั้ง${s.n?' – '+s.n:''}`};
 const todo=e.items.filter(k=>!e.ready[k]);
 if(rd.length)t+=`\n✅ พร้อมสอบ\n`+rd.map(line).join('\n')+'\n';if(todo.length)t+=`\n⏳ ยังต้องซ้อม\n`+todo.map(line).join('\n')+'\n';return t.trim()}
function copyExam(){const t=examText();copybox.hidden=false;copyout.value=t;copymsg.textContent='';
 navigator.clipboard.writeText(t).then(()=>copymsg.textContent='คัดลอกแล้ว นำไปวางในแชตได้เลย',()=>{copyout.select();copymsg.textContent='กดค้างที่ข้อความแล้วเลือกคัดลอก'})}

let regPhoto=null;
const CAM='<span class="cam"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>';

 c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);cb(c.toDataURL('image/jpeg',.85))};img.src=fr.result};fr.readAsDataURL(file)}

 const ta=document.getElementById('pdata'),msg=document.getElementById('pmsg');msg.textContent='';

 ok.onclick=()=>{if(m=='exp'){navigator.clipboard.writeText(ta.value).then(()=>msg.textContent='คัดลอกแล้ว',()=>{ta.select();msg.textContent='กดค้างที่ข้อความแล้วเลือกคัดลอก'})}
  else if(m=='imp'){try{st=JSON.parse(ta.value);migrate();save();show('home');panel()}catch(e){msg.textContent='ข้อความไม่ถูกต้อง ลองคัดลอกมาใหม่ทั้งหมด'}}

fs.onchange=render;document.getElementById('q').oninput=render;regc.innerHTML=CORGI_FACE.replace('<svg ','<svg class="corgi-reg" ');walk.innerHTML=CORGI_FACE;show('home');
